<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    --fg:#e9edff; --dim:#8c94b8; --faint:#5d6488; --accent:#5b8def; --line:rgba(255,255,255,.09);
    --card:rgba(255,255,255,.045); --ok:#34d399; --bad:#f87171; --run:#fbbf24;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body {
    background:radial-gradient(120% 80% at 50% 0%, #131a38 0%, #080a18 55%, #04050c 100%);
    color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
    overflow:hidden; user-select:none; -webkit-font-smoothing:antialiased;
  }
  .app { height:100%; display:flex; flex-direction:column; align-items:center; padding:10px 16px 14px; gap:0; }
  canvas { width:300px; height:250px; flex:none; cursor:pointer; }
  #status { font-size:12px; font-weight:600; letter-spacing:.38em; text-transform:uppercase; padding-left:.38em;
            color:var(--accent); transition:color .5s; margin-top:-10px; }
  #sub { font-size:12px; color:var(--dim); min-height:1.4em; margin-top:3px; text-align:center; }
  #cap { width:100%; flex:1 1 auto; min-height:44px; margin-top:8px; text-align:center; overflow:hidden;
         display:flex; flex-direction:column; gap:6px; mask-image:linear-gradient(#000 80%,transparent); }
  #you { color:var(--dim); font-size:13px; line-height:1.35; }
  #jarvis { font-size:16px; line-height:1.4; }

  /* plan card */
  #plan { width:100%; flex:none; background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:11px 12px 10px; margin-top:8px; display:none; animation:in .35s ease-out; }
  #plan.show { display:block; }
  #plan.finished { opacity:.55; transition:opacity 1s; }
  .plan-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .plan-title { font-size:13px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:2px 7px; border-radius:6px;
           background:rgba(255,255,255,.08); color:var(--dim); flex:none; }
  .badge.pending { color:#6ee7b7; background:rgba(52,211,153,.14); animation:pulse 1.4s infinite; }
  .badge.approved { color:#6ee7b7; background:rgba(52,211,153,.14); }
  .badge.declined { color:#fca5a5; background:rgba(248,113,113,.14); }
  .bar { height:3px; border-radius:2px; background:rgba(255,255,255,.07); overflow:hidden; margin-bottom:8px; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#5b8def,#34d399); transition:width .5s; }
  #steps { list-style:none; padding:0; display:flex; flex-direction:column; gap:5px; max-height:150px; overflow:auto; }
  #steps li { display:flex; gap:9px; font-size:12.5px; line-height:1.35; align-items:flex-start; }
  #steps li .ic { width:16px; height:16px; flex:none; margin-top:1px; border-radius:50%; border:1.5px solid var(--faint);
                  display:grid; place-items:center; font-size:10px; font-weight:700; }
  #steps li.running .ic { border-color:var(--run); border-right-color:transparent; animation:spin .8s linear infinite; }
  #steps li.done .ic { border-color:var(--ok); background:var(--ok); color:#06281c; }
  #steps li.failed .ic { border-color:var(--bad); background:var(--bad); color:#3b0a0a; }
  #steps li.skipped .ic { border-style:dashed; }
  #steps li.done .tx, #steps li.skipped .tx { color:var(--dim); }
  #steps li .note { display:block; font-size:11px; color:var(--faint); }
  .plan-btns { display:none; gap:8px; margin-top:10px; }
  #plan.ask .plan-btns { display:flex; }
  .plan-btns button { flex:1; height:34px; }
  #approve { background:rgba(52,211,153,.18); border-color:rgba(52,211,153,.45); color:#d1fae5; font-weight:600; }
  #approve:hover { background:rgba(52,211,153,.3); }

  /* brain switch */
  #brain { position:fixed; top:10px; right:12px; z-index:5; display:flex; gap:2px; padding:3px; border-radius:999px;
           background:rgba(255,255,255,.06); border:1px solid var(--line); backdrop-filter:blur(6px); }
  #brain button { height:26px; padding:0 12px; border-radius:999px; border:0; background:transparent; color:var(--dim);
                  font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; }
  #brain button:hover:not(:disabled) { background:rgba(255,255,255,.1); color:var(--fg); }
  #brain button.on { background:rgba(91,141,239,.28); color:#fff; box-shadow:0 0 12px rgba(91,141,239,.35); }
  #brain button#b-qwen.on { background:rgba(167,139,250,.28); box-shadow:0 0 12px rgba(167,139,250,.35); }
  #brain button.loading { animation:pulse 1s infinite; color:#fff; }
  #brain button:disabled { opacity:.35; cursor:not-allowed; }

  /* routine report */
  #report { width:100%; flex:none; background:var(--card); border:1px solid var(--line); border-radius:14px;
            padding:10px 12px; margin-top:8px; display:none; animation:in .35s ease-out; }
  #report.show { display:block; }
  .rep-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  #rep-title { font-size:13px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rep-btn { height:26px; padding:0 10px; font-size:12px; border-radius:8px; }
  #rep-text { max-height:150px; overflow:auto; font-size:12.5px; line-height:1.45; white-space:pre-wrap; user-select:text;
              color:#cfd6f5; }

  /* activity */
  #acts { width:100%; flex:none; display:flex; flex-direction:column; gap:6px; margin:8px 0 10px; }
  .act { display:grid; grid-template-columns:auto auto 1fr auto; align-items:center; column-gap:9px; font-size:12px;
         padding:7px 10px; border-radius:11px; background:var(--card); border:1px solid var(--line); animation:in .35s ease-out; }
  .act .dot { width:8px; height:8px; border-radius:50%; background:var(--run); animation:pulse 1.1s infinite; }
  .act.ok .dot { background:var(--ok); animation:none; }
  .act.fail .dot { background:var(--bad); animation:none; }
  .act .who { font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:2px 6px; border-radius:6px;
              background:rgba(255,255,255,.08); color:var(--dim); white-space:nowrap; }
  .act .who.claude { color:#c4b5fd; background:rgba(167,139,250,.15); }
  .act .who.chrome { color:#7dd3fc; background:rgba(56,189,248,.15); }
  .act .who.gemini { color:#f9a8d4; background:rgba(244,114,182,.15); }
  .act .lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .act .det { grid-column:3 / 5; font-size:11px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .act .det:empty { display:none; }
  .act .x { display:none; background:none; border:0; color:var(--faint); font-size:15px; padding:0 2px; height:auto; }
  .act.job:not(.ok):not(.fail) .x { display:block; }
  .act .x:hover { color:var(--bad); background:none; }

  #route { width:100%; flex:none; text-align:center; font-size:11px; color:var(--faint); margin:-4px 0 6px;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #route.hs { color:#7dd3fc; }
  footer { width:100%; flex:none; display:flex; gap:8px; }
  #txt { flex:1; min-width:0; background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--fg);
         border-radius:12px; padding:10px 12px; font:inherit; font-size:13px; outline:none; user-select:text; }
  #txt:focus { border-color:var(--accent); }
  button { background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--fg); border-radius:12px;
           padding:0 14px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.12); }
  button:focus-visible, #txt:focus-visible, canvas:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #mute.on { background:rgba(248,113,113,.18); border-color:rgba(248,113,113,.5); color:#fecaca; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }
  @keyframes pulse { 50% { opacity:.35; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .act, .act .dot, #plan, .badge { animation:none !important; } }
</style>
</head>
<body>
<div id="brain" role="group" aria-label="Which AI brain is active">
  <button id="b-gemini" title="Gemini (cloud)">☁ Gemini</button>
  <button id="b-qwen" title="Qwen (on this PC)">⌂ Qwen</button>
</div>
<div class="app">
  <canvas id="orb" role="button" tabindex="0" aria-label="Jarvis status. Click to stop talking." title="Click to stop talking (Esc)"></canvas>
  <div id="status" aria-live="polite">Connecting</div>
  <div id="sub"></div>
  <div id="cap"><div id="you"></div><div id="jarvis"></div></div>

  <section id="plan" aria-live="polite">
    <div class="plan-head"><span class="plan-title" id="plan-title"></span><span class="badge" id="plan-badge"></span></div>
    <div class="bar"><i id="plan-bar"></i></div>
    <ol id="steps"></ol>
    <div class="plan-btns"><button id="cancel">Cancel</button><button id="approve">Approve</button></div>
  </section>

  <section id="report" aria-live="polite">
    <div class="rep-head"><span id="rep-title"></span>
      <button class="rep-btn" id="rep-copy" title="Copy this text">Copy</button>
      <button class="rep-btn" id="rep-close" title="Hide" aria-label="Hide">×</button></div>
    <div id="rep-text"></div>
  </section>
  <div id="acts"></div>
  <div id="route" title="Where Jarvis listens and speaks"></div>
  <footer>
    <input id="txt" placeholder="Type a command…" autocomplete="off" aria-label="Type a command">
    <button id="mute" title="Mute microphone (Ctrl+M)">Mute</button>
  </footer>
</div>
<script>
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t');
const LABEL = { idle:'Ready', listening:'Listening', thinking:'Thinking', speaking:'Speaking', working:'Working on it',
                waiting:'Waiting for your OK', offline:'Offline' };
const COL = { idle:[91,141,239], listening:[34,211,238], thinking:[167,139,250], speaking:[244,114,182],
              working:[251,191,36], waiting:[52,211,153], offline:[96,100,125] };
const WHO = { self:['Me','self'], claude:['Claude · terminal','claude'], chrome:['Claude · Chrome','chrome'],
              gemini:['Gemini brain','gemini'], install:['Installer','self'], extension:['GNOME','self'] };
const ICON = { done:'✓', failed:'✕', skipped:'–' };

let state = 'offline', mic = 0, out = 0, tasks = 0, notice = '', ws;

function setState(s) {
  state = s;
  $('status').textContent = LABEL[s] || s;
  $('status').style.color = `rgb(${(COL[s] || COL.idle).join(',')})`;
}
function setSub() {
  $('sub').textContent = notice || (tasks ? `${tasks} background job${tasks > 1 ? 's' : ''} running` : '');
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?t=${token}`);
  ws.onopen = () => setState('idle');
  ws.onclose = () => { setState('offline'); setTimeout(connect, 1000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'tick') {
      if (m.state !== state) setState(m.state);
      mic = m.mic; out = m.out;
      if (m.tasks !== tasks) { tasks = m.tasks; setSub(); }
    } else if (m.type === 'caption') {
      const el = m.who === 'you' ? $('you') : $('jarvis');
      if (m.new) { if (m.who === 'you') $('jarvis').textContent = ''; el.textContent = ''; }
      el.textContent += m.text;
    } else if (m.type === 'activity') activity(m);
    else if (m.type === 'plan') plan(m);
    else if (m.type === 'engine') renderBrain(m);
    else if (m.type === 'report') { $('rep-title').textContent = m.title; $('rep-text').textContent = m.text; $('report').classList.add('show'); }
    else if (m.type === 'route') { $('route').textContent = (m.headset ? '🎧 ' : '🔈 ') + m.label; $('route').classList.toggle('hs', !!m.headset); }
    else if (m.type === 'notice') { notice = m.text; setSub(); }
  };
}

function activity(m) {
  let el = document.getElementById('act-' + m.id);
  if (!el) {
    el = document.createElement('div'); el.id = 'act-' + m.id;
    el.innerHTML = '<span class="dot"></span><span class="who"></span><span class="lbl"></span>' +
                   '<button class="x" title="Cancel this job" aria-label="Cancel job">×</button><span class="det"></span>';
    $('acts').appendChild(el);
    while ($('acts').children.length > 3) $('acts').firstChild.remove();
  }
  const [txt, cls] = WHO[m.kind] || WHO.self;
  const who = el.querySelector('.who'); who.textContent = txt; who.className = 'who ' + cls;
  el.className = 'act ' + (m.state === 'running' ? '' : m.state) + (m.job ? ' job' : '');
  el.querySelector('.lbl').textContent = m.label; el.title = m.label;
  el.querySelector('.det').textContent = m.detail || '';
  el.querySelector('.x').onclick = () => send({ type:'cancel_job', id:m.job });
}

function plan(m) {
  const card = $('plan');
  card.classList.add('show');
  $('plan-title').textContent = m.title;
  const steps = m.steps || [];
  const finished = steps.length && steps.every(s => ['done','failed','skipped'].includes(s.status));
  card.classList.toggle('ask', m.approval === 'pending');
  card.classList.toggle('finished', !!finished || m.approval === 'declined');
  const badge = $('plan-badge');
  badge.className = 'badge ' + (m.approval || '');
  badge.textContent = m.approval === 'pending' ? 'needs your OK' : m.approval === 'approved' ? 'approved'
                    : m.approval === 'declined' ? 'cancelled' : finished ? 'finished' : 'plan';
  const done = steps.filter(s => s.status === 'done' || s.status === 'skipped').length;
  $('plan-bar').style.width = steps.length ? (100 * done / steps.length) + '%' : '0';
  const ol = $('steps'); ol.textContent = '';
  steps.forEach((s, i) => {
    const li = document.createElement('li'); li.className = s.status;
    const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = ICON[s.status] || '';
    const tx = document.createElement('span'); tx.className = 'tx'; tx.textContent = `${i + 1}. ${s.text}`;
    if (s.note) { const n = document.createElement('span'); n.className = 'note'; n.textContent = s.note; tx.appendChild(n); }
    li.append(ic, tx); ol.appendChild(li);
  });
  const run = ol.querySelector('.running'); if (run) run.scrollIntoView({ block:'nearest' });
}

function renderBrain(m) {
  for (const k of ['gemini', 'qwen']) {
    const b = $('b-' + k), info = (m.brains || {})[k] || { ok: false, why: 'unknown', label: k };
    b.classList.toggle('on', m.active === k);
    b.classList.toggle('loading', m.switching === k);
    b.disabled = !info.ok && m.active !== k;
    b.title = m.active === k ? info.label + ' is active' : info.ok ? 'Switch to ' + info.label
            : info.label + ' is not available: ' + info.why;
    b.setAttribute('aria-pressed', m.active === k);
  }
}
for (const k of ['gemini', 'qwen']) $('b-' + k).onclick = () => { if (!$('b-' + k).classList.contains('on')) send({ type:'engine', value:k }); };
document.addEventListener('keydown', e => {
  if (e.altKey && e.key.toLowerCase() === 'b') { const other = $('b-gemini').classList.contains('on') ? 'qwen' : 'gemini'; send({ type:'engine', value:other }); }
});
$('rep-close').onclick = () => $('report').classList.remove('show');
$('rep-copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('rep-text').textContent); $('rep-copy').textContent = 'Copied'; }
  catch (e) { $('rep-copy').textContent = 'Select + Ctrl+C'; }
  setTimeout(() => $('rep-copy').textContent = 'Copy', 1500);
};
$('approve').onclick = () => send({ type:'approve', value:true });
$('cancel').onclick = () => send({ type:'approve', value:false });
$('txt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) { send({ type:'text', text:e.target.value.trim() }); e.target.value = ''; }
});
function toggleMute() {
  const on = !$('mute').classList.contains('on');
  $('mute').classList.toggle('on', on); $('mute').textContent = on ? 'Muted' : 'Mute';
  send({ type:'mute', value:on });
}
$('mute').onclick = toggleMute;
$('orb').onclick = () => send({ type:'stop' });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') send({ type:'stop' });
  else if (e.ctrlKey && e.key.toLowerCase() === 'm') { e.preventDefault(); toggleMute(); }
  else if (e.target === $('orb') && (e.key === 'Enter' || e.key === ' ')) send({ type:'stop' });
});

/* ---------- orb ---------- */
const cv = $('orb'), ctx = cv.getContext('2d');
const W = 300, H = 250, DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur = [...COL.offline], lvl = 0, ripples = [], lastRipple = 0, lastT = 0;

function blob(cx, cy, R, amp, ph, fill) {
  ctx.beginPath();
  const N = 90;
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2;
    const r = R * (1 + amp * (0.55 * Math.sin(3 * a + ph * 1.3) + 0.35 * Math.sin(5 * a - ph * 1.7) + 0.25 * Math.sin(2 * a + ph * .9)));
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}

function frame(ms) {
  const t = ms / 1000, dt = Math.min(.1, t - lastT || .016), k = reduce ? 0.3 : 1; lastT = t;
  const tgt = COL[state] || COL.idle, ease = 1 - Math.pow(.001, dt);     // frame-rate independent
  cur = cur.map((c, i) => c + (tgt[i] - c) * ease);
  const [r, g, b] = cur.map(Math.round), rgba = a => `rgba(${r},${g},${b},${a})`;
  const raw = state === 'speaking' ? out : state === 'listening' ? mic : 0;
  lvl += (raw - lvl) * Math.min(1, dt * 14);
  const cx = W / 2, cy = H / 2, R = 60;
  ctx.clearRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(cx, cy, R * .5, cx, cy, R * 2.3);
  glow.addColorStop(0, rgba(.3 + .35 * lvl)); glow.addColorStop(1, rgba(0));
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  if (state === 'listening' && mic > .15 && t - lastRipple > .28) { ripples.push(t); lastRipple = t; }
  if (state === 'waiting' && t - lastRipple > 1.2) { ripples.push(t); lastRipple = t; }
  ripples = ripples.filter(s => t - s < 1.4);
  for (const s of ripples) {
    const p = (t - s) / 1.4;
    ctx.strokeStyle = rgba(.5 * (1 - p)); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R * (1.1 + p * .9), 0, 7); ctx.stroke();
  }

  const base = { idle:.03 + .012 * Math.sin(t * 1.3), listening:.05, thinking:.05, speaking:.06, working:.06,
                 waiting:.035 + .015 * Math.sin(t * 2), offline:.015 }[state] ?? .04;
  const amp = (base + lvl * .22) * k;
  const speed = { idle:.6, listening:1, thinking:1.6, speaking:1.3, working:1.8, waiting:.8, offline:.3 }[state] ?? 1;
  for (let i = 2; i >= 0; i--) {
    const grad = ctx.createRadialGradient(cx - R * .3, cy - R * .35, R * .1, cx, cy, R * 1.25);
    grad.addColorStop(0, i ? rgba(.25) : 'rgba(255,255,255,.92)');
    grad.addColorStop(.35, rgba(i ? .35 : .95));
    grad.addColorStop(1, rgba(i ? .1 : .55));
    ctx.shadowColor = rgba(.8); ctx.shadowBlur = i ? 0 : 28;
    blob(cx, cy, R * (1 + i * .07) * (1 + .025 * Math.sin(t * 1.5 + i)), amp * (1 + i * .5), t * speed + i * 2.1, grad);
  }
  ctx.shadowBlur = 0;

  if (state === 'speaking') {
    const n = 56;
    ctx.strokeStyle = rgba(.85); ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + t * .3;
      const len = 4 + out * 34 * (.45 + .55 * Math.abs(Math.sin(i * .9 + t * 9)));
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * R * 1.28, cy + Math.sin(a) * R * 1.28);
      ctx.lineTo(cx + Math.cos(a) * (R * 1.28 + len), cy + Math.sin(a) * (R * 1.28 + len)); ctx.stroke();
    }
  } else if (state === 'thinking') {
    ctx.lineCap = 'round'; ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const a = t * (1.6 + i * .5) * (i % 2 ? -1 : 1) + i * 2;
      ctx.strokeStyle = rgba(.9 - i * .2);
      ctx.beginPath(); ctx.arc(cx, cy, R * (1.38 + i * .14), a, a + 1.1 + i * .3); ctx.stroke();
    }
  } else if (state === 'working') {
    ctx.setLineDash([3, 9]); ctx.strokeStyle = rgba(.5); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.5, t * .7, t * .7 + 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = rgba(.95);
    for (let i = 0; i < 14; i++) {
      const a = t * (.9 + (i % 4) * .25) + i * 2.4, rr = R * (1.3 + .28 * Math.sin(i * 1.7 + t * .8));
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * .92, 2.4 + (i % 3), 0, 7); ctx.fill();
    }
  }
  requestAnimationFrame(frame);
}
setState('offline'); connect(); requestAnimationFrame(frame);
</script>
</body>
</html>
